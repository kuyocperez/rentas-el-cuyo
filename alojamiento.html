<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071522">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="description" content="Consulta los detalles, fotografías y precios publicados de este alojamiento en El Cuyo, Yucatán. Contacta directamente con el anfitrión.">
<title>Alojamiento en El Cuyo | Rentas El Cuyo</title>
<link rel="canonical" href="https://www.rentaselcuyo.com.mx/alojamiento.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rentas El Cuyo">
<meta property="og:title" content="Alojamiento en El Cuyo | Rentas El Cuyo">
<meta property="og:description" content="Conoce este alojamiento en El Cuyo y consulta directamente con el anfitrión.">
<meta property="og:url" content="https://www.rentaselcuyo.com.mx/alojamiento.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
<link rel="manifest" href="/site.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#071522;--panel:#0d2638;--ink:#eaf5f7;--muted:#a7bec8;--line:#254253;--aqua:#27d9c5;--gold:#f3bd78}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#14607955,transparent 38%),var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(920px,calc(100% - 32px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:850;text-decoration:none;letter-spacing:-.03em}.back{display:inline-block;margin:22px 0;color:var(--aqua);text-decoration:none}.panel{background:#0d2638dd;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:0 0 48px}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:180px;gap:6px;background:#102b3b}.gallery img{width:100%;height:100%;object-fit:cover;display:block}.gallery img:first-child{grid-row:span 2}.body{padding:clamp(20px,5vw,38px)}.eyebrow{color:var(--aqua);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.1;letter-spacing:-.045em;margin:10px 0}.location,.muted{color:var(--muted)}.facts,.prices{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.chip,.price{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#102f42}.price{border-radius:13px;color:var(--gold)}.price strong{display:block;color:var(--ink);font-size:1.12rem}.description{white-space:pre-line}.cta{display:inline-flex;margin-top:18px;padding:13px 19px;border-radius:999px;background:linear-gradient(110deg,#18b9b1,#27ddc6);color:#05232d;font-weight:850;text-decoration:none}.mobile-whatsapp{display:none}.note{font-size:.86rem;color:var(--muted);margin-top:22px}.state{padding:48px 24px;text-align:center}.state a{color:var(--aqua)}footer{padding:0 0 35px;color:var(--muted);font-size:.85rem}@media(max-width:620px){body{padding-bottom:88px}.gallery{grid-template-columns:1fr 1fr;grid-auto-rows:130px}.gallery img:first-child{grid-column:span 2;grid-row:auto;height:210px}.mobile-whatsapp{display:flex;position:fixed;z-index:30;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));justify-content:center;align-items:center;min-height:54px;padding:13px 18px;border-radius:999px;background:linear-gradient(110deg,#18b9b1,#27ddc6);color:#05232d;font-weight:850;text-decoration:none;box-shadow:0 8px 28px #001d1d55}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/">RENTA S EL CUYO</a></div></header>
<main class="wrap"><a class="back" href="/">← Volver a todos los alojamientos</a><article class="panel"><div id="content"><div class="state">Cargando información del alojamiento…</div></div></article></main>
<footer class="wrap">Rentas El Cuyo · El Cuyo, Yucatán, México. Los precios, disponibilidad y condiciones deben confirmarse directamente con el anfitrión.</footer>
<script>
(() => {
'use strict';
const SUPABASE_URL='https://eeagrqnpdinnipetiysz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_xCCqnS7S0GdmnlYqt0whFQ_Ts-Hu5ZH';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const root=document.getElementById('content');
const params=new URLSearchParams(location.search);
const id=params.get('id');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const local=v=>v&&typeof v==='object'&&!Array.isArray(v)?(v.es??v.en??Object.values(v)[0]??''):(v??'');
const money=v=>v===null||v===undefined||v===''?'':new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(v));
const phone=v=>{let n=String(v??'').replace(/\D/g,'');if(n.length===10)n='52'+n;return n.length>=11&&n.length<=15?n:''};
function metadata(row,title,description,photo){
 const url=location.origin+location.pathname+'?id='+encodeURIComponent(id);
 document.title=title+' | Rentas El Cuyo';
 document.querySelector('meta[name="description"]').content=description.slice(0,300);
 document.querySelector('link[rel="canonical"]').href=url;
 document.querySelector('meta[property="og:title"]').content=title+' | Rentas El Cuyo';
 document.querySelector('meta[property="og:description"]').content=description.slice(0,300);
 document.querySelector('meta[property="og:url"]').content=url;
 if(photo){let m=document.querySelector('meta[property="og:image"]');if(!m){m=document.createElement('meta');m.setAttribute('property','og:image');document.head.appendChild(m)}m.content=photo;document.querySelector('meta[name="twitter:card"]').content='summary_large_image';}
 const schema={'@context':'https://schema.org','@type':'LodgingBusiness','name':title,'description':description,'url':url,'address':{'@type':'PostalAddress','addressLocality':'El Cuyo','addressRegion':'Yucatán','addressCountry':'MX'}};
 if(photo)schema.image=photo;
 const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify(schema);document.head.appendChild(ld);
}
async function load(){
 if(!id){root.innerHTML='<div class="state"><h1>Falta identificar el alojamiento</h1><p>Abre esta página desde una publicación del catálogo.</p><a href="/">Volver al catálogo</a></div>';return;}
 try{
  const {data:row,error}=await db.from('properties').select('*').eq('id',id).eq('is_published',true).maybeSingle();
  if(error)throw error;
  if(!row){root.innerHTML='<div class="state"><h1>Alojamiento no disponible</h1><p>Esta publicación no existe o ya no está publicada.</p><a href="/">Ver alojamientos disponibles</a></div>';return;}
  const title=String(local(row.title)||'Alojamiento en El Cuyo');
  const location=String(local(row.location)||'El Cuyo, Yucatán');
  const description=String(local(row.description)||'Consulta directamente con el anfitrión para conocer los detalles de este alojamiento.');
  let photos=row.photos;if(typeof photos==='string'){try{photos=JSON.parse(photos)}catch{photos=[photos]}}if(!Array.isArray(photos))photos=[];photos=photos.filter(x=>typeof x==='string'&&/^https:\/\//i.test(x));
  const type=String(local(row.property_type)||'Alojamiento');
  const facts=[type,row.max_guests?row.max_guests+' huéspedes':null,row.bedrooms!==null&&row.bedrooms!==undefined?row.bedrooms+' habitaciones':null,row.bathrooms!==null&&row.bathrooms!==undefined?row.bathrooms+' baños':null].filter(Boolean);
  const prices=[['Por noche',row.nightly_price],['Por semana',row.weekly_price],['Por mes',row.monthly_price]].filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=='');
  const wa=phone(row.whatsapp_phone);
  metadata(row,title,description,photos[0]);
  const gallery=photos.length?'<div class="gallery">'+photos.slice(0,5).map((p,i)=>'<img src="'+esc(p)+'" alt="'+esc(title)+' en El Cuyo, fotografía '+(i+1)+'" '+(i?'loading="lazy"':'fetchpriority="high"')+'>').join('')+'</div>':'';
  const priceHtml=prices.length?'<h2>Precios publicados</h2><div class="prices">'+prices.map(p=>'<div class="price">'+esc(p[0])+'<strong>'+esc(money(p[1]))+'</strong></div>').join('')+'</div>':'';
  const waHref=wa?'https://wa.me/'+wa+'?text='+encodeURIComponent('Hola, me interesa el alojamiento '+title+' que vi en Rentas El Cuyo. ¿Me puedes confirmar precio y disponibilidad?') :'';
  const contact=wa?'<a class="cta" href="'+esc(waHref)+'" target="_blank" rel="noopener">Consultar con el anfitrión por WhatsApp</a>':'<p class="muted">El anfitrión aún no ha agregado un número de WhatsApp de contacto.</p>';
  root.innerHTML=gallery+'<div class="body"><span class="eyebrow">Alojamiento en El Cuyo · Yucatán</span><h1>'+esc(title)+'</h1><p class="location">⌖ '+esc(location)+'</p><div class="facts">'+facts.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div><h2>Acerca del alojamiento</h2><p class="description">'+esc(description)+'</p>'+priceHtml+contact+'<p class="note">La información y las tarifas son proporcionadas por el anfitrión. Confirma directamente la disponibilidad, el precio final, la dirección exacta, los servicios y las condiciones antes de reservar.</p></div>'+(wa?'<a class="mobile-whatsapp" href="'+esc(waHref)+'" target="_blank" rel="noopener">Consultar por WhatsApp</a>':'');
 }catch(e){console.error(e);root.innerHTML='<div class="state"><h1>No pudimos cargar este alojamiento</h1><p>Intenta nuevamente en unos minutos.</p><a href="/">Volver al catálogo</a></div>';}
}
load();
})();
</script>
</body>
</html>
